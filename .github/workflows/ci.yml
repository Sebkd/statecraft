name: CI

# Runs on GitHub's hosted runners. Development lives on Gitea; commits reach
# GitHub via a push mirror, and that push triggers this workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (tokio)
        run: cargo clippy --workspace --all-targets --features tokio -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The Tokio adapter test needs the `tokio` feature. Run it on its own,
      # not with the whole workspace: `tokio` (like `public-emit`) alters
      # generated code, and the trybuild UI-test snapshots assume the default
      # feature set, so running trybuild with these features would break.
      - name: Test (tokio adapter)
        run: cargo test --features tokio --test tokio_adapter

      # Heap-placement policy: the default (only `#[on(.., boxed)]` marks) and
      # the wholesale one. Both need `diagnostics` for `apply_future_size`.
      # Targeted at the test, not the workspace, for the same reason as above:
      # these features alter generated code and the trybuild snapshots assume
      # the default feature set.
      - name: Test (dispatch policy, default)
        run: cargo test --features diagnostics --test boxed_dispatch

      - name: Test (dispatch policy, boxed-all)
        run: cargo test --features diagnostics,boxed-all --test boxed_dispatch

      # Ignored by default (aborts a child process on purpose), so run it
      # explicitly — but only the positive case. Whether an *inlined* handler
      # overflows a given budget is an optimiser decision, not a property of
      # this crate: a codegen improvement would turn that assertion red with
      # nothing regressed. The counterpart stays a local diagnostic.
      - name: Test (dispatch stack fits budget)
        run: cargo test --test dispatch_stack -- --ignored --exact boxed_handler_fits_the_budget

      - name: Clippy (boxed-all + diagnostics)
        run: cargo clippy --workspace --all-targets --features boxed-all,diagnostics -- -D warnings

      # Compile-check the optional features (public-emit, tokio, boxed-all,
      # diagnostics).
      - name: Build (all features)
        run: cargo build --workspace --all-targets --all-features

  msrv:
    name: Check MSRV (1.96.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Library surface only (no --all-targets): dev-dependencies such as
      # trybuild may require a newer compiler than the crate's own MSRV.
      - name: Check
        run: cargo check --workspace --all-features
