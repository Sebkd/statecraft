[package]
name = "statecraft-fsm-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "Procedural macros for the `statecraft-fsm` async finite state machine crate"

[lib]
proc-macro = true

[features]
# Enabled via the `statecraft` facade's `public-emit` feature; makes the
# generated `emit` method `pub`.
public-emit = []
# Enabled via the `statecraft` facade's `tokio` feature; generates the Tokio
# adapter (spawn/Handle/watch).
tokio = []

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
trybuild = "1.0"
# Circular dev-only dependency: UI tests exercise the generated code, which
# references `::statecraft_fsm` (e.g. `ApplyError`).
statecraft-fsm = { path = ".." }
tokio = { workspace = true, features = ["full"] }
