[package]
name = "statecraft-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

description = "Procedural macros for the `statecraft` async finite state machine crate"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
trybuild = "1.0"
# Circular dev-only dependency: UI tests exercise the generated code, which
# references `::statecraft` (e.g. `ApplyError`).
statecraft = { path = ".." }
tokio = { workspace = true, features = ["full"] }
